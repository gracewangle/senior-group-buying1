<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당골집</title>

  <style>
    :root {
      --bg: #fff8f0;
      --surface: #ffffff;
      --surface-soft: #fff4d6;
      --text: #111827;
      --muted: #6b7280;
      --primary: #facc15;
      --border: #eadfce;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 18px 48px rgba(92, 64, 18, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(250, 204, 21, 0.18), transparent 34%),
        linear-gradient(180deg, #fff8f0 0%, #fafaf7 100%);
      color: var(--text);
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
    }

    .page {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(960px, calc(100% - 32px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 950;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: #111827;
      font-weight: 950;
      box-shadow: 0 10px 26px rgba(250, 204, 21, 0.32);
    }

    .admin-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 850;
      font-size: 14px;
    }

    .hero {
      margin-top: 24px;
      padding: 28px;
      border-radius: 32px;
      background: linear-gradient(135deg, #fff7dc 0%, #ffffff 64%);
      box-shadow: var(--shadow);
      border: 1px solid rgba(234, 223, 206, 0.8);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: #fff0b8;
      color: #7a5200;
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.16;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 650;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 20px;
      margin-top: 20px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .product-card {
      display: grid;
      gap: 18px;
    }

    .product-visual {
      min-height: 220px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 76% 24%, rgba(250, 204, 21, 0.34), transparent 25%),
        radial-gradient(circle at 20% 82%, rgba(22, 163, 74, 0.16), transparent 28%),
        linear-gradient(135deg, #fff2c7, #ffffff);
      display: grid;
      place-items: center;
      color: #7a5200;
      text-align: center;
      padding: 22px;
      font-size: 24px;
      font-weight: 950;
      word-break: keep-all;
    }

    .info-list {
      display: grid;
      gap: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #f2eadc;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-row span {
      color: var(--muted);
      font-weight: 850;
    }

    .info-row strong {
      text-align: right;
      font-size: 18px;
      font-weight: 950;
      word-break: keep-all;
    }

    .price {
      color: #e11d48;
      font-size: 28px;
      font-weight: 950;
    }

    .form {
      display: grid;
      gap: 16px;
    }

    .form-title {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 950;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span {
      font-size: 14px;
      color: #3f3a32;
      font-weight: 900;
    }

    .input,
    .textarea {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fffefb;
      color: var(--text);
      padding: 14px 16px;
      outline: none;
      font-size: 17px;
      font-weight: 650;
    }

    .textarea {
      min-height: 104px;
      resize: vertical;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.18);
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-radius: 20px;
      background: var(--surface-soft);
    }

    .total-box span {
      color: #5f5444;
      font-weight: 900;
    }

    .total-box strong {
      color: #111827;
      font-size: 28px;
      font-weight: 950;
      white-space: nowrap;
    }

    .btn {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 18px;
      background: var(--primary);
      color: #111827;
      font-size: 18px;
      font-weight: 950;
      box-shadow: 0 12px 28px rgba(250, 204, 21, 0.25);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin: 0;
      min-height: 24px;
      font-size: 15px;
      font-weight: 850;
    }

    .message.error {
      color: var(--danger);
    }

    .notice {
      padding: 14px 16px;
      border-radius: 18px;
      background: #fff7df;
      border: 1px solid #f6dfaa;
      color: #6b5122;
      font-size: 14px;
      font-weight: 750;
    }

    .complete-page {
      min-height: 100vh;
      padding: 32px 16px;
      background: #fff8e6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .complete-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .complete-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #12b76a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
    }

    .complete-card h1 {
      margin: 0 0 10px;
      color: #111827;
      font-size: 26px;
      line-height: 1.25;
    }

    .complete-desc {
      margin: 0 0 24px;
      color: #15803d;
      font-size: 17px;
      line-height: 1.5;
      font-weight: 800;
    }

    .summary-box,
    .bank-box {
      margin-bottom: 18px;
      padding: 18px;
      border-radius: 18px;
      background: #f9fafb;
      text-align: left;
    }

    .summary-box h2,
    .bank-box h2 {
      margin: 0 0 14px;
      color: #111827;
      font-size: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row span {
      color: #6b7280;
      font-weight: 800;
    }

    .summary-row strong {
      color: #111827;
      text-align: right;
      font-weight: 950;
    }

    .summary-row.total strong {
      color: #dc2626;
      font-size: 18px;
    }

    .bank-box p {
      margin: 6px 0;
      color: #374151;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 750;
    }

    .recommend-code {
      margin: 10px 0 16px;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .contact-button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border-radius: 16px;
      background: #facc15;
      color: #111827;
      font-size: 18px;
      font-weight: 900;
      text-decoration: none;
      box-sizing: border-box;
    }

    .admin-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 16px;
    }

    .admin-head h1 {
      margin: 0;
      font-size: 34px;
    }

    .admin-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1e7d8;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #fff7df;
      color: #5f5444;
      font-weight: 950;
    }

    td {
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #fff0b8;
      color: #7a5200;
      font-size: 12px;
      font-weight: 950;
    }

    .empty {
      padding: 38px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 850;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .hero,
      .card,
      .complete-card {
        padding: 20px;
      }

      .topbar-inner {
        min-height: 64px;
      }

      .brand {
        font-size: 21px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 14px;
      }

      .product-visual {
        min-height: 180px;
        font-size: 21px;
      }

      .total-box strong {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://cszmvqyyjwipcjyhjbrv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzem12cXl5andpcGNqeWhqYnJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQwOTMsImV4cCI6MjA5NjA1MDA5M30.PlvE9spfqAVIvfAITCZOoGPOQvyKxK6b6dA9qjl94Jc";
    const KAKAO_CHAT_URL = "https://open.kakao.com/o/sblMxpwi";

    const PRODUCT = {
      name: "난각1번 당일산란 자연방사 무항생제 유정란 20구",
      price: 9900,
      shippingFee: 4000
    };

    const BANK_INFO = {
      bankName: "우리은행",
      accountNumber: "1111111",
      holder: "로컬비"
    };

    const app = document.getElementById("app");

    const isSupabaseConfigured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("여기에_") &&
      SUPABASE_ANON_KEY &&
      !SUPABASE_ANON_KEY.includes("여기에_");

    const supabaseClient =
      window.supabase && isSupabaseConfigured
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    // 실제 운영 전에는 RLS 정책을 강화하여 관리자만 전체 주문을 조회할 수 있게 해야 함.

    // curator_code는 큐레이터별 판매 추적용 코드입니다.
    // 예: ?c=dg001 링크로 주문하면 orders.curator_code에 dg001이 저장됩니다.
    // 실제 운영 시 큐레이터 이름/연락처는 별도 curators 테이블에서 관리할 수 있습니다.

    function formatWon(value) {
      return `${Number(value || 0).toLocaleString("ko-KR")}원`;
    }

    function toNumber(value) {
      const number = Number(String(value || "0").replace(/[^\d]/g, ""));
      return Number.isFinite(number) ? number : 0;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getCuratorCode() {
      const params = new URLSearchParams(window.location.search);
      const code = String(params.get("c") || "").trim();
      return code || "direct";
    }

    function calculateTotalPrice(quantity) {
      const qty = Math.max(1, toNumber(quantity));
      return PRODUCT.price * qty + PRODUCT.shippingFee;
    }

    function isAdminPage() {
      const params = new URLSearchParams(window.location.search);
      return params.get("admin") === "1";
    }

    function renderShell(content) {
      app.innerHTML = `
        <header class="topbar">
          <div class="topbar-inner">
            <div class="brand">
              <span class="brand-mark">당</span>
              <span>당골집</span>
            </div>
            <a class="admin-link" href="?admin=1">관리자</a>
          </div>
        </header>
        <main class="page">
          ${content}
        </main>
      `;
    }

    function renderOrderPage() {
      const curatorCode = getCuratorCode();
      const totalPrice = calculateTotalPrice(1);

      renderShell(`
        <section class="hero">
          <span class="eyebrow">당골집 공동구매 주문</span>
          <h1>${escapeHtml(PRODUCT.name)}</h1>
          <p class="subtitle">큐레이터가 공유한 링크로 주문을 접수합니다.</p>
        </section>

        <section class="layout">
          <article class="card product-card">
            <div class="product-visual">
              당일산란<br>무항생제 유정란
            </div>

            <div class="info-list">
              <div class="info-row">
                <span>상품명</span>
                <strong>${escapeHtml(PRODUCT.name)}</strong>
              </div>
              <div class="info-row">
                <span>상품 가격</span>
                <strong class="price">${formatWon(PRODUCT.price)}</strong>
              </div>
              <div class="info-row">
                <span>배송비</span>
                <strong>${formatWon(PRODUCT.shippingFee)}</strong>
              </div>
            </div>

            <div class="notice">
              입금 확인 후 순차적으로 안내드립니다. 주문 정보는 정확하게 입력해주세요.
            </div>
          </article>

          <form class="card form" id="orderForm" onsubmit="submitOrder(event)">
            <h2 class="form-title">주문자 정보</h2>

            <label class="field">
              <span>주문자 이름</span>
              <input class="input" type="text" name="buyer_name" autocomplete="name">
            </label>

            <label class="field">
              <span>연락처</span>
              <input class="input" type="tel" name="buyer_phone" placeholder="010-0000-0000" autocomplete="tel">
            </label>

            <label class="field">
              <span>주소</span>
              <input class="input" type="text" name="address" autocomplete="street-address">
            </label>

            <label class="field">
              <span>수량</span>
              <input class="input" type="number" name="quantity" min="1" value="1" oninput="updateTotalPrice()">
            </label>

            <label class="field">
              <span>요청사항</span>
              <textarea class="textarea" name="memo" placeholder="예: 부재 시 문 앞에 놓아주세요."></textarea>
            </label>

            <div class="total-box">
              <span>총 결제금액</span>
              <strong id="totalPrice">${formatWon(totalPrice)}</strong>
            </div>

            <p id="formMessage" class="message"></p>

            <button class="btn" id="submitButton" type="submit">주문하기</button>
          </form>
        </section>
      `);
    }

    function updateTotalPrice() {
      const form = document.getElementById("orderForm");
      const totalEl = document.getElementById("totalPrice");
      if (!form || !totalEl) return;

      const quantity = toNumber(form.quantity.value);
      totalEl.textContent = formatWon(calculateTotalPrice(quantity));
    }

    function showMessage(message, type) {
      const messageEl = document.getElementById("formMessage");
      if (!messageEl) return;

      messageEl.textContent = message;
      messageEl.className = `message ${type || ""}`.trim();
    }

    async function submitOrder(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const submitButton = document.getElementById("submitButton");

      const buyerName = String(form.buyer_name.value || "").trim();
      const buyerPhone = String(form.buyer_phone.value || "").trim();
      const address = String(form.address.value || "").trim();
      const quantity = toNumber(form.quantity.value);
      const memo = String(form.memo.value || "").trim();

      if (!buyerName) {
        showMessage("이름을 입력해주세요.", "error");
        form.buyer_name.focus();
        return;
      }

      if (!buyerPhone) {
        showMessage("연락처를 입력해주세요.", "error");
        form.buyer_phone.focus();
        return;
      }

      if (!address) {
        showMessage("주소를 입력해주세요.", "error");
        form.address.focus();
        return;
      }

      if (quantity < 1) {
        showMessage("수량을 확인해주세요.", "error");
        form.quantity.focus();
        return;
      }

      if (!supabaseClient) {
        showMessage("주문 저장 중 문제가 발생했습니다. 다시 시도해주세요.", "error");
        return;
      }

      const orderData = {
        product_name: PRODUCT.name,
        curator_code: getCuratorCode(),
        buyer_name: buyerName,
        buyer_phone: buyerPhone,
        address: address,
        quantity: quantity,
        product_price: PRODUCT.price,
        shipping_fee: PRODUCT.shippingFee,
        total_price: calculateTotalPrice(quantity),
        payment_method: "bank_transfer",
        order_status: "pending",
        memo: memo
      };

      try {
        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = "주문 접수 중...";
        }

        const { data, error } = await supabaseClient
          .from("orders")
          .insert([orderData])
          .select();

        if (error) {
          console.error(error);
          showMessage("주문 저장 중 문제가 발생했습니다. 다시 시도해주세요.", "error");

          if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = "주문하기";
          }

          return;
        }

        showOrderComplete(orderData, data?.[0]);
      } catch (error) {
        console.error(error);
        showMessage("주문 저장 중 문제가 발생했습니다. 다시 시도해주세요.", "error");

        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "주문하기";
        }
      }
    }

    function showOrderComplete(orderData, savedOrder) {
      app.innerHTML = `
        <main class="complete-page">
          <section class="complete-card">
            <div class="complete-icon">✓</div>

            <h1>주문이 접수되었습니다</h1>
            <p class="complete-desc">입금 확인 후 순차적으로 안내드리겠습니다.</p>

            <div class="summary-box">
              <h2>주문 정보</h2>

              <div class="summary-row">
                <span>상품명</span>
                <strong>${escapeHtml(orderData.product_name)}</strong>
              </div>

              <div class="summary-row">
                <span>주문자명</span>
                <strong>${escapeHtml(orderData.buyer_name)}</strong>
              </div>

              <div class="summary-row">
                <span>연락처</span>
                <strong>${escapeHtml(orderData.buyer_phone)}</strong>
              </div>

              <div class="summary-row">
                <span>수량</span>
                <strong>${Number(orderData.quantity).toLocaleString("ko-KR")}개</strong>
              </div>

              <div class="summary-row total">
                <span>총 결제금액</span>
                <strong>${Number(orderData.total_price).toLocaleString("ko-KR")}원</strong>
              </div>

              <div class="summary-row">
                <span>주문 상태</span>
                <strong>입금대기</strong>
              </div>
            </div>

            <div class="bank-box">
              <h2>입금 안내</h2>
              <p>은행: ${escapeHtml(BANK_INFO.bankName)}</p>
              <p>계좌번호: ${escapeHtml(BANK_INFO.accountNumber)}</p>
              <p>예금주: ${escapeHtml(BANK_INFO.holder)}</p>
              <p>입금자명은 주문자명과 동일하게 입력해주세요.</p>
              <p>주문 내용 확인 후 배송 및 입금 관련 안내를 드릴 예정입니다.</p>
            </div>

            <p class="recommend-code">추천 코드: ${escapeHtml(orderData.curator_code)}</p>

            <a class="contact-button" href="${escapeHtml(KAKAO_CHAT_URL)}" target="_blank" rel="noopener noreferrer">
              카카오톡으로 문의하기
            </a>
          </section>
        </main>
      `;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function orderStatusLabel(status) {
      const labels = {
        pending: "입금대기",
        paid: "입금완료",
        canceled: "취소",
        refunded: "환불"
      };

      return labels[status] || status || "입금대기";
    }

    async function renderAdminPage() {
      renderShell(`
        <section class="admin-head">
          <div>
            <h1>주문 관리</h1>
            <p>Supabase orders 테이블의 주문을 최신순으로 확인합니다.</p>
          </div>
        </section>

        <section class="card">
          <p class="notice">주문 목록을 불러오는 중입니다.</p>
        </section>
      `);

      if (!supabaseClient) {
        renderShell(`
          <section class="admin-head">
            <div>
              <h1>주문 관리</h1>
              <p>Supabase 설정이 필요합니다.</p>
            </div>
          </section>

          <section class="card">
            <p class="message error">
              SUPABASE_URL과 SUPABASE_ANON_KEY를 입력해야 주문 목록을 조회할 수 있습니다.
            </p>
          </section>
        `);
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from("orders")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          console.error(error);
          renderAdminError();
          return;
        }

        renderAdminTable(data || []);
      } catch (error) {
        console.error(error);
        renderAdminError();
      }
    }

    function renderAdminError() {
      renderShell(`
        <section class="admin-head">
          <div>
            <h1>주문 관리</h1>
            <p>주문 목록 조회 중 문제가 발생했습니다.</p>
          </div>
        </section>

        <section class="card">
          <p class="message error">주문 목록을 불러오지 못했습니다. Supabase 설정과 RLS 정책을 확인해주세요.</p>
        </section>
      `);
    }

    function renderAdminTable(orders) {
      const rows = orders.map((order) => `
        <tr>
          <td>${escapeHtml(order.buyer_name)}</td>
          <td>${escapeHtml(order.buyer_phone)}</td>
          <td>${escapeHtml(order.address)}</td>
          <td>${escapeHtml(order.quantity)}</td>
          <td>${formatWon(order.total_price)}</td>
          <td>${escapeHtml(order.curator_code || "direct")}</td>
          <td><span class="badge">${escapeHtml(orderStatusLabel(order.order_status))}</span></td>
        </tr>
      `).join("");

      renderShell(`
        <section class="admin-head">
          <div>
            <h1>주문 관리</h1>
            <p>Supabase orders 테이블의 주문을 최신순으로 확인합니다.</p>
          </div>
        </section>

        <section class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>연락처</th>
                <th>주소</th>
                <th>수량</th>
                <th>총액</th>
                <th>큐레이터 코드</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>

          ${orders.length ? "" : '<div class="empty">아직 접수된 주문이 없습니다.</div>'}
        </section>
      `);
    }

    function render() {
      if (isAdminPage()) {
        renderAdminPage();
        return;
      }

      renderOrderPage();
    }

    window.updateTotalPrice = updateTotalPrice;
    window.submitOrder = submitOrder;

    render();
  </script>
</body>
</html>
