<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>당골집 MVP v29 | 레퍼런스 모바일앱형</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --surface:#ffffff;
      --surface-2:#f9fafb;
      --text:#111827;
      --muted:#6b7280;
      --primary:#f97316;
      --primary-dark:#ea580c;
      --danger:#dc2626;
      --success:#16a34a;
      --warning:#d97706;
      --blue:#2563eb;
      --border:#e5e7eb;
      --radius:8px;
      --shadow:0 16px 36px rgba(17,24,39,.07);
      --bottom:82px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:linear-gradient(180deg,#fff7ed 0,#f6f7fb 210px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;font-size:16px}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    h1,h2,h3,p{word-break:keep-all}
    .app{min-height:100vh;padding-bottom:var(--bottom)}
    .page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 42px}
    .auth-page{min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(460px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
    .brand-block{display:grid;gap:8px;margin-bottom:20px}
    .brand-name{font-size:30px;font-weight:950;color:var(--primary)}
    .subtitle{margin:0;color:var(--muted);line-height:1.55}
    .form,.grid{display:grid;gap:14px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{display:grid;gap:7px}
    .field span,.field label{font-size:13px;font-weight:850}
    .input,.select,textarea{width:100%;min-height:48px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);padding:0 13px;font-size:16px}
    textarea{min-height:96px;padding:12px;resize:vertical}
    .check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:14px;line-height:1.45}
    .btn{min-height:48px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);font-weight:850;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.primary:hover{background:var(--primary-dark)}
    .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
    .btn.ghost{background:#fff}
    .btn.small{min-height:34px;font-size:13px;padding:0 10px}
    .btn.block{width:100%}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .toolbar .input,.toolbar .select{width:auto;min-width:170px}
    .hint{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;color:var(--muted);font-size:13px;line-height:1.55}
    .error{min-height:18px;margin:0;color:var(--danger);font-size:13px;font-weight:850}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
    .top-inner{width:min(1180px,calc(100% - 32px));min-height:64px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:950}
    .brand-mark{width:34px;height:34px;border-radius:var(--radius);background:var(--primary);color:#fff;display:grid;place-items:center}
    .userbox{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;flex-wrap:wrap}
    .layout{width:min(1180px,calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;padding:22px 0 42px}
    .side{position:sticky;top:84px;align-self:start;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(17,24,39,.05);padding:10px}
    .side button{width:100%;justify-content:flex-start;margin:2px 0}
    .side .active,.bottom-tabs .active{background:#fff7ed;border-color:#fdba74;color:var(--primary)}
    .content{min-width:0}
    .hero,.panel,.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 28px rgba(17,24,39,.055)}
    .hero{padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
    .hero h1{margin:0;font-size:26px;line-height:1.28}
    .panel{padding:16px}
    .card{padding:16px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
    .section-title h2{margin:0;font-size:20px}
    .muted{color:var(--muted)}
    .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .metric{display:grid;gap:8px}
    .metric span{color:var(--muted);font-size:13px}
    .metric strong{font-size:22px}
    .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .product-card{padding:0;overflow:hidden}
    .product-visual{height:150px;background:#f8fafc;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:850;border-bottom:1px solid var(--border)}
    .product-visual img{width:100%;height:100%;object-fit:cover}
    .image-placeholder{padding:10px 12px;border:1px dashed #cbd5e1;border-radius:999px;background:#fff}
    .product-body{padding:15px;display:grid;gap:10px}
    .info{display:grid;gap:8px}
    .info-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f3f4f6;padding:7px 0}
    .info-row span{color:var(--muted)}
    .info-row strong{text-align:right}
    .price{font-size:22px;font-weight:950;color:var(--primary)}
    .price-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .price-box{border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--surface-2)}
    .price-box span{display:block;color:var(--muted);font-size:12px;font-weight:850;margin-bottom:4px}
    .consumer-price{font-weight:950;text-decoration:line-through;color:#9ca3af}
    .dangol-price{font-size:20px;font-weight:950;color:var(--danger)}
    .compact-product{display:grid;gap:10px}
    .compact-product .product-body{padding:14px}
    .compact-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:850}
    .compact-meta.split-meta{display:grid;grid-template-columns:1fr;gap:8px}
    .meta-pill{border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:9px 10px;display:grid;gap:2px}
    .meta-pill b{font-size:12px;color:var(--muted)}
    .meta-pill span{font-size:14px;color:var(--text);font-weight:900}
    .earning-mini{border:1px solid #fed7aa;background:#fff7ed;border-radius:var(--radius);padding:10px;display:grid;gap:8px}
    .earning-mini div{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .earning-mini span{color:#9a3412;font-size:13px;font-weight:900}
    .earning-mini strong{color:#c2410c;font-size:19px;white-space:nowrap}
    .earning-mini input{width:100%;accent-color:var(--primary)}
    .earning-slider{border:1px solid #fed7aa;background:#fff7ed;border-radius:var(--radius);padding:11px;display:grid;gap:8px}
    .earning-slider label{display:flex;justify-content:space-between;gap:10px;color:#9a3412;font-size:13px;font-weight:850}
    .earning-slider input{width:100%;accent-color:var(--primary)}
    .earning-slider strong{color:#c2410c}
    .earning-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .earning-head span{color:#9a3412;font-size:13px;font-weight:900}
    .earning-head strong{display:grid;text-align:right;font-size:22px;line-height:1.15}
    .earning-head small{font-size:12px;color:#9a3412;font-weight:800}
    .profit-callout{border:1px solid #fdba74;background:#fff7ed;border-radius:var(--radius);padding:12px;display:grid;gap:3px}
    .profit-callout span{color:#9a3412;font-size:12px;font-weight:900}
    .profit-callout strong{font-size:24px;color:#c2410c}
    .profit-callout small{color:#9a3412;font-weight:800}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .summary-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:12px;display:grid;gap:4px}
    .summary-card span{color:var(--muted);font-size:12px;font-weight:850}
    .summary-card strong{font-size:18px}
    .click-card{transition:.15s}
    .click-card:hover{transform:translateY(-2px);border-color:#fdba74}
    .share-link{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;line-height:1.45;word-break:break-all}
    .upload-box{border:1px dashed #cbd5e1;border-radius:var(--radius);padding:12px;background:var(--surface-2)}
    .upload-preview{height:132px;border-radius:var(--radius);background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;margin-top:8px}
    .upload-preview img{width:100%;height:100%;object-fit:cover}
    .detail-copy{white-space:pre-line;line-height:1.7}
    .detail-content{line-height:1.7}
    .detail-content img,.rich-editor img{max-width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--border);display:block;margin:12px 0}
    .detail-image{width:100%;border-radius:var(--radius);border:1px solid var(--border);display:block;margin-top:12px}
    .detail-editor{grid-column:1/-1;border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface-2);display:grid;gap:12px}
    .detail-editor h3{margin:0;font-size:16px}
    .rich-editor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .rich-editor-toolbar .select,.rich-editor-toolbar .input{width:auto;min-width:120px}
    .rich-editor{min-height:240px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;line-height:1.7;outline:none;overflow:auto}
    .rich-editor:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(249,115,22,.16)}
    .batch-card{display:grid;gap:9px}
    .batch-meta{color:var(--muted);font-size:13px;line-height:1.5}
    .batch-status{margin-top:2px}
    .batch-status .select{width:100%;min-height:48px;font-weight:850}
    .save-toolbar{justify-content:flex-end;margin:0 0 12px}
    .link-button{border:0;background:transparent;padding:0;color:var(--text);font:inherit;font-weight:950;text-align:left;text-decoration:underline;text-decoration-color:#fed7aa;text-underline-offset:4px}
    .nowrap{white-space:nowrap}
    .compact-cell{white-space:nowrap;width:1%}
    .product-admin-table{min-width:1280px}
    .product-admin-table td:first-child{min-width:150px;white-space:nowrap;font-weight:850}
    .order-list-table{min-width:760px}
    .order-list-table td:nth-child(4){min-width:260px}
    .fulfillment-box{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fulfillment-item{border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:10px;display:grid;gap:4px}
    .fulfillment-item span{color:var(--muted);font-size:12px;font-weight:850}
    .fulfillment-item strong{font-size:15px}
    .changed-mark{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;padding:0 8px;font-size:12px;font-weight:950;white-space:nowrap}
    .status-cell{display:grid;gap:6px;min-width:124px}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
    .mobile-card-list{display:none}
    .data-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(17,24,39,.05);padding:14px;display:grid;gap:12px}
    .data-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .data-card-title{display:grid;gap:4px}
    .data-card-title strong{font-size:17px}
    .data-card-title span{color:var(--muted);font-size:13px;font-weight:800}
    .data-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .data-field{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);padding:9px;display:grid;gap:3px;min-width:0}
    .data-field span{color:var(--muted);font-size:12px;font-weight:850}
    .data-field strong{font-size:15px;word-break:keep-all}
    .data-card-actions{display:grid;grid-template-columns:1fr;gap:8px}
    .card-more{border-top:1px solid #f1e5d8;padding-top:8px}
    .card-more summary{cursor:pointer;color:#9a3412;font-weight:900}
    .card-more .info{margin-top:8px}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{border-bottom:1px solid var(--border);padding:11px 10px;text-align:left;vertical-align:middle;font-size:14px}
    th{background:var(--surface-2);color:#4b5563;font-size:13px;white-space:nowrap}
    tr:last-child td{border-bottom:0}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-height:26px;border-radius:999px;padding:0 9px;font-size:12px;font-weight:900;white-space:nowrap}
    .badge.gray{background:#f3f4f6;color:#4b5563}
    .badge.blue{background:#eff6ff;color:var(--blue)}
    .badge.green{background:#ecfdf5;color:var(--success)}
    .badge.yellow{background:#fffbeb;color:var(--warning)}
    .badge.red{background:#fef2f2;color:var(--danger)}
    .badge.orange{background:#fff7ed;color:var(--primary)}
    .empty{border:1px dashed #cbd5e1;border-radius:var(--radius);background:#fff;padding:28px;text-align:center;color:var(--muted)}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.42);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:34px 16px}
    .modal.show{display:flex}
    .modal-panel{width:min(820px,100%);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .modal-panel.wide{width:min(1120px,calc(100% - 24px))}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .modal-head h2{margin:0;font-size:21px}
    .assign-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:10px}
    .assign-item{display:grid;gap:6px;background:var(--surface-2);border-radius:var(--radius);padding:10px}
    .toast{position:fixed;top:18px;right:18px;z-index:90;background:#111827;color:#fff;border-radius:var(--radius);padding:12px 14px;font-weight:850;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);transition:.18s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    .bottom-tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.98);border-top:1px solid var(--border);box-shadow:0 -10px 26px rgba(17,24,39,.08);padding:8px 12px}
    .bottom-inner{width:min(1180px,100%);margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;overflow-x:auto}
    .bottom-inner button{min-width:96px;min-height:52px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-weight:900;color:#4b5563}
    .public-shell{min-height:100vh}
    .public-head{border-bottom:1px solid var(--border);background:#fff}
    .public-head .top-inner{justify-content:flex-start}
    .order-detail{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}
    @media(max-width:980px){
      .layout{display:block}
      .side{display:none}
      .grid.cols-3,.grid.cols-4,.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .order-detail{grid-template-columns:1fr}
      .toolbar{display:grid}
      .toolbar .input,.toolbar .select{width:100%}
    }
    @media(max-width:680px){
      :root{--bottom:78px}
      .page,.layout,.top-inner{width:calc(100% - 24px)}
      .auth-card{padding:18px}
      .form-grid,.grid.cols-2,.grid.cols-3,.grid.cols-4,.product-grid,.assign-list,.summary-grid{grid-template-columns:1fr}
      .hero{padding:18px}
      .hero h1{font-size:22px}
      .card,.panel{padding:14px}
      .product-body{padding:14px}
      .btn,.input,.select{min-height:50px}
      table{min-width:760px}
      th,td{padding:10px 8px;font-size:13px}
      .price-box{padding:9px}
      .dangol-price{font-size:18px}
      .profit-callout{padding:10px}
      .profit-callout strong{font-size:22px}
      .responsive-table{display:none}
      .mobile-card-list{display:grid;gap:10px;margin-top:16px}
      .data-card-grid{grid-template-columns:1fr 1fr}
      .modal{padding:18px 8px}
      .modal-panel.wide{width:100%}
      .userbox .muted{display:none}
      .bottom-tabs{padding:7px 8px}
      .bottom-inner{gap:6px}
      .bottom-inner button{min-width:76px;min-height:48px;font-size:12px}
      .toast{left:50%;right:auto;width:min(360px,calc(100% - 28px));text-align:center;transform:translate(-50%,-8px)}
      .toast.show{transform:translate(-50%,0)}
    }
    /* v26 design refresh */
    :root{
      --bg:#fff8f0;
      --surface:#ffffff;
      --surface-2:#fffaf3;
      --text:#111827;
      --muted:#6f6258;
      --primary:#f97316;
      --primary-dark:#ea580c;
      --border:#f1e5d8;
      --radius:22px;
      --shadow:0 18px 46px rgba(124,45,18,.10);
    }
    body{background:radial-gradient(circle at 20% 0,#ffedd5 0,rgba(255,237,213,0) 310px),linear-gradient(180deg,#fff8f0 0,#fafaf7 52%);font-size:17px}
    .auth-page{background:radial-gradient(circle at 20% 12%,#fed7aa 0,rgba(254,215,170,.18) 34%,transparent 58%),linear-gradient(135deg,#fff8f0,#fafaf7)}
    .auth-card{width:min(520px,100%);padding:34px;border-color:#fed7aa;box-shadow:0 24px 70px rgba(124,45,18,.14)}
    .brand-name{font-size:36px;letter-spacing:-.2px}
    .subtitle{font-size:16px}
    .input,.select,textarea{min-height:54px;border-color:#eadfD2;background:#fffdf9;border-radius:18px}
    .input:focus,.select:focus,textarea:focus{outline:none;border-color:#fb923c;box-shadow:0 0 0 4px rgba(249,115,22,.14)}
    .btn{min-height:54px;border-radius:18px;border-color:#eadfd2;box-shadow:0 4px 12px rgba(17,24,39,.04)}
    .btn.primary{font-size:17px;box-shadow:0 14px 26px rgba(249,115,22,.24)}
    .btn.small{min-height:38px;border-radius:14px}
    .topbar{background:rgba(255,253,249,.92);border-color:#f1e5d8}
    .brand-mark{border-radius:16px;box-shadow:0 10px 24px rgba(249,115,22,.28)}
    .layout{gap:22px}
    .side,.hero,.panel,.card,.data-card{border-color:#f1e5d8;border-radius:24px;box-shadow:var(--shadow)}
    .side{padding:12px}
    .side button,.bottom-inner button{border-radius:18px}
    .hero{position:relative;overflow:hidden;padding:26px;background:linear-gradient(135deg,#fff 0,#fff7ed 100%)}
    .hero:after{content:"";position:absolute;right:-48px;top:-58px;width:170px;height:170px;border-radius:999px;background:rgba(249,115,22,.12);pointer-events:none}
    .hero>*{position:relative;z-index:1}
    .hero h1{font-size:30px;letter-spacing:-.2px}
    .welcome-hero{min-height:178px;align-content:center}
    .welcome-hero h1{max-width:720px;font-size:32px}
    .quick-action{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
    .metric{background:linear-gradient(180deg,#fff,#fffaf4);padding:20px}
    .metric span{font-size:14px;color:#7c5f49}
    .metric strong{font-size:30px;letter-spacing:-.4px}
    .product-grid{gap:18px}
    .product-card{border-radius:24px;background:#fff;box-shadow:0 18px 42px rgba(124,45,18,.10)}
    .product-visual{height:176px;background:linear-gradient(135deg,#fff1df 0,#fed7aa 48%,#fb923c 140%);color:#9a3412;border-color:#f6d6b7}
    .product-visual img{transition:transform .2s}
    .product-card:hover .product-visual img{transform:scale(1.03)}
    .image-placeholder{border:0;background:rgba(255,255,255,.74);color:#9a3412;padding:12px 16px;font-size:14px}
    .product-body{padding:18px;gap:13px}
    .product-body h3{font-size:22px;line-height:1.25}
    .price-compare{gap:10px}
    .price-box{border-color:#f1e5d8;background:#fffaf4;border-radius:18px;padding:13px}
    .dangol-price{font-size:25px;color:#e11d48}

        const month=String(s.created_at||order.created_at||today()).slice(0,7);

    function sanitizeDetailHtml(html){
      const template=document.createElement("template");
      template.innerHTML=html;
      const allowed=new Set(["DIV","P","BR","B","STRONG","I","EM","U","SPAN","IMG","UL","OL","LI","H2","H3","FONT"]);
      const clean=node=>{
        Array.from(node.childNodes).forEach(child=>{
          if(child.nodeType===Node.TEXT_NODE)return;
          if(child.nodeType!==Node.ELEMENT_NODE){child.remove();return}
          if(!allowed.has(child.tagName)){
            child.replaceWith(document.createTextNode(child.textContent||""));
            return;
          }
          Array.from(child.attributes).forEach(attrNode=>{
            const name=attrNode.name.toLowerCase();
            const value=attrNode.value;
            if(child.tagName==="IMG"&&name==="src"&&(value.startsWith("data:image/")||value.startsWith("http://")||value.startsWith("https://")))return;
            if(child.tagName==="IMG"&&name==="alt")return;
            if(child.tagName==="FONT"&&(name==="color"||name==="size"))return;
            if(name==="style"){
              const safe=value.split(";").map(rule=>rule.trim()).filter(rule=>/^(color|font-size|text-align)\s*:/i.test(rule)).join("; ");
              if(safe){child.setAttribute("style",safe);return}
            }
            child.removeAttribute(attrNode.name);
          });
          clean(child);
        });
      };
      clean(template.content);
      return template.innerHTML;
    }

    function copyText(text){
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast("고객용 링크를 복사했습니다.")).catch(()=>fallbackCopy(text));
      }else fallbackCopy(text);
    }
    function fallbackCopy(text){
      const area=document.createElement("textarea");
      area.value=text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      toast("고객용 링크를 복사했습니다.");
    }

    function saveProduct(event,id){
      event.preventDefault();
      clearModalError();
      syncDetailEditor();
      const fd=new FormData(event.currentTarget);
      const name=String(fd.get("name")||"").trim();
      const existing=productById(id);
      const nextId=id||uid("P");
      const slug=existing?.slug||autoSlug(name,nextId);
      if(!name){modalError("상품명을 입력해주세요.");return}
      const price=num(fd.get("price"));
      const curatorCommission=num(fd.get("curator_commission"));
      const supplyPrice=num(fd.get("supply_price"));
      const consumerPrice=num(fd.get("consumer_price"))||price;
      const opMargin=price-curatorCommission-supplyPrice;
      const next={id:nextId,name,slug,category:String(fd.get("category")||"").trim(),consumer_price:consumerPrice,price,supply_price:supplyPrice,curator_commission_rate:num(fd.get("curator_commission_rate")),curator_commission:curatorCommission,operation_margin_rate:price?Math.round(opMargin/price*1000)/10:0,operation_margin:opMargin,sample_provided:String(fd.get("sample_provided")||"").trim(),sample_condition:String(fd.get("sample_condition")||"").trim(),shipping_fee:num(fd.get("shipping_fee")),image_url:String(fd.get("image_url")||"").trim(),detail_image_url:"",detail_content:String(fd.get("detail_content")||"").trim(),delivery_info:String(fd.get("delivery_info")||"").trim(),refund_info:String(fd.get("refund_info")||"").trim(),status:String(fd.get("status")),created_at:id?(existing?.created_at||today()):today(),updated_at:today()};
      if(next.price<=0){modalError("판매가는 1원 이상이어야 합니다.");return}
      if(next.consumer_price<next.price){modalError("소비자가는 당골가보다 낮을 수 없습니다.");return}
      data.products=id?data.products.map(p=>p.id===id?next:p):[next,...data.products];
      saveData();closeModal();toast(id?"상품이 수정되었습니다.":"상품이 등록되었습니다.");render();
    }

    function batchKey(curatorId,productId){return `${curatorId}_${productId}`}
    function dominantDeliveryStatus(group){
      const candidates=["배송준비","배송중","배송완료"];
      const ranked=candidates.map(s=>({status:s,count:group.filter(o=>o.delivery_status===s).length})).sort((a,b)=>b.count-a.count);
      return ranked[0]?.count?ranked[0].status:"배송준비";
    }
    function setDeliveryDraft(key,status){deliveryDrafts[key]=status;render()}
    function saveDeliveryDrafts(){
      const entries=Object.entries(deliveryDrafts);
      if(!entries.length){toast("저장할 배송 변경이 없습니다.");return}
      let count=0;
      entries.forEach(([key,status])=>{
        const [curatorId,productId]=key.split("_");
        data.orders.forEach(o=>{
          if(o.curator_id===curatorId&&o.product_id===productId&&o.payment_status==="입금완료"){
            o.delivery_status=status;
            o.updated_at=today();
            count++;
          }
        });
      });
      deliveryDrafts={};
      saveData();
      toast(`${count}건의 배송 상태를 저장했습니다.`);
      render();
    }
    function adminDeliveryBatches(rows){
      const paid=rows.filter(o=>o.payment_status==="입금완료");
      const groups=Object.values(groupBy(paid,o=>`${o.curator_id}_${o.product_id}`));
      if(!groups.length)return empty("입금완료 상태의 묶음 배송 대상 주문이 없습니다.");
      const openGroups=groups.filter(group=>!group.every(o=>o.delivery_status==="배송완료"));
      const doneGroups=groups.filter(group=>group.every(o=>o.delivery_status==="배송완료"));
      const showAll=filters.batch_view==="all";
      const renderGroupCards=(list)=>list.map(group=>{
        const first=group[0],p=orderProduct(first),c=curatorById(first.curator_id);
        const qty=group.reduce((a,o)=>a+Number(o.quantity||0),0);
        const statuses=DELIVERY_STATUSES.map(s=>`${s} ${group.filter(o=>o.delivery_status===s).length}건`).filter(t=>!t.includes(" 0건")).join(" · ");
        const key=batchKey(first.curator_id,first.product_id);
        const dominant=dominantDeliveryStatus(group);
        const selected=deliveryDrafts[key]||dominant;
        const changed=deliveryDrafts[key]&&deliveryDrafts[key]!==dominant;
        return `<article class="card batch-card">
          <div>${badge("입금완료")} <span class="badge orange">${esc(p.name)}</span></div>
          <h3 style="margin:0"><button class="link-button" onclick="openBatchOrders('${first.curator_id}','${first.product_id}')">${esc(c?.name||"-")} 큐레이터</button></h3>
          <div class="batch-meta">주문 ${group.length}건 · 수량 ${qty}개<br>${esc(statuses||"배송 상태 없음")}</div>
          <label class="field batch-status"><span>배송 상태</span><select class="select" onchange="setDeliveryDraft('${key}',this.value)">${["배송준비","배송중","배송완료"].map(s=>`<option ${s===selected?"selected":""}>${s}</option>`).join("")}</select>${changedMark(changed)}</label>
        </article>`;
      }).join("");
      const moreNeeded=openGroups.length>2||doneGroups.length>2;
      const visibleOpen=showAll?openGroups:openGroups.slice(0,2);
      const visibleDone=showAll?doneGroups:doneGroups.slice(0,2);
      return `<div class="batch-summary-bar">
        <span>처리 필요 ${openGroups.length}개</span>
        <span>배송완료 ${doneGroups.length}개</span>
        ${moreNeeded?`<button class="btn small" onclick="setFilter('batch_view','${showAll?"":"all"}')">${showAll?"2개만 보기":"전체보기"}</button>`:""}
      </div>
      <div class="batch-section-label">배송 처리 필요</div>
      ${visibleOpen.length?`<section class="orders-grid batch-grid">${renderGroupCards(visibleOpen)}</section>`:empty("처리할 묶음 배송이 없습니다.")}
      <div class="batch-section-label done">배송완료</div>
      ${visibleDone.length?`<section class="orders-grid batch-grid completed">${renderGroupCards(visibleDone)}</section>`:empty("배송완료 묶음이 없습니다.")}`;
    }

    function savePaymentStatus(orderId,status){
      const order=data.orders.find(o=>o.id===orderId);

    function saveSelectedPaymentStatus(){
      const status=document.getElementById("bulkPaymentStatus")?.value||"";
      const ids=Array.from(paymentSelections);
      if(!ids.length){toast("입금상태를 변경할 주문을 체크해주세요.");return}
      if(!status){toast("변경할 입금상태를 선택해주세요.");return}
      let count=0;

    function adminOrderTable(rows,editable){

        ${rows.map(o=>{const p=orderProduct(o),c=curatorById(o.curator_id);return `<tr><td>${esc(o.created_at)}</td><td>${esc(o.order_number)}</td><td>${esc(p.name)}</td><td>${esc(c?.name||"-")}</td><td>${esc(o.buyer_name)}</td><td>${esc(o.buyer_phone)}</td><td>${esc(o.buyer_address)}</td><td>${o.quantity}</td><td>${won(o.total_price)}</td><td>${editable?statusSelect(o.id,"payment_status",o.payment_status,PAYMENT_STATUSES):badge(o.payment_status)}</td><td>${editable?statusSelect(o.id,"delivery_status",o.delivery_status,DELIVERY_STATUSES):badge(o.delivery_status)}</td></tr>`}).join("")}

    function statusSelect(orderId,key,value,options){
      const selected=(orderDrafts[orderId]&&orderDrafts[orderId][key])||value;
      const changed=orderDrafts[orderId]&&orderDrafts[orderId][key]&&orderDrafts[orderId][key]!==value;
      return `<div class="status-cell"><select class="select" onchange="setOrderDraft('${orderId}','${key}',this.value)">${options.map(v=>`<option ${v===selected?"selected":""}>${v}</option>`).join("")}</select>${changedMark(changed)}</div>`;

    function setOrderDraft(orderId,key,value){
      const order=data.orders.find(o=>o.id===orderId);
      if(!order)return;
      orderDrafts[orderId]={...(orderDrafts[orderId]||{}),[key]:value};
      render();

    function updateOrderStatus(orderId,key,value){setOrderDraft(orderId,key,value)}
    function applyOrderStatus(order,key,value){
      if(!order)return false;
      if(order[key]===value)return false;
      order[key]=value;
      order.updated_at=today();

    function curatorSettlementGroups(groups){
      const map=new Map();

        if(!map.has(key)){

        }
        const item=map.get(key);
        item.groups.push(g);
        item.quantity+=g.quantity;
        item.sales_amount+=g.sales_amount;
        item.commission_amount+=g.commission_amount;
        item.tax_amount+=g.tax_amount;
        item.payout_amount+=g.payout_amount;
        if(settlementVisibleStatus(g)!=="정산완료"){
          item.unpaid_amount+=g.payout_amount;
          item.unpaid_count++;
        }
      });

        const an=curatorById(a.curator_id)?.name||"";
        const bn=curatorById(b.curator_id)?.name||"";
        return an.localeCompare(bn,"ko");
      });

    function applySettlementStatus(id,status){

      s.payout_completed_at=status==="정산완료"?today():"";
      const order=data.orders.find(o=>o.id===s.order_id);
      if(order)order.settlement_status=status;
      return true;
    }
    function settlementGroupKeyById(id){

      const product=settlementProduct(s);
      const month=String(s.created_at||order.created_at||today()).slice(0,7);
      return [s.curator_id,product.id||s.product_id||order.product_id,month].join("|");

    function handleImageUpload(event,name,previewId){
      const file=event.target.files&&event.target.files[0];
      if(!file)return;
      if(!file.type.startsWith("image/")){modalError("이미지 파일만 업로드할 수 있습니다.");return}
      const reader=new FileReader();
      reader.onload=()=>{
        const value=String(reader.result||"");
        const form=event.target.closest("form");
        const hidden=form?.querySelector(`input[name="${name}"]`);
        const preview=document.getElementById(previewId);
        if(hidden)hidden.value=value;
        if(preview)preview.innerHTML=`<img src="${attr(value)}" alt="업로드 이미지 미리보기">`;
      };
      reader.readAsDataURL(file);
    }

      modal.innerHTML=`<div class="modal-panel">
        <div class="modal-head"><h2>더미 데이터 초기화</h2><button class="btn small" onclick="closeModal()">닫기</button></div>
        <p class="subtitle">더미 데이터가 초기화됩니다. 이 작업은 되돌릴 수 없습니다. 계속할까요?</p>
        <div class="toolbar" style="margin-top:16px;justify-content:flex-end">
          <button class="btn" onclick="closeModal()">취소</button>
          <button class="btn danger" onclick="closeModal();resetData()">확인</button>
        </div>
      </div>`;
      showModal();
    }
    function closeModal(){modal.classList.remove("show");modal.setAttribute("aria-hidden","true");modal.innerHTML=""}
    function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2200)}
